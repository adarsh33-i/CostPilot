async function downloadExport(runId, format) {
  if (!runId) { toast("This card has no run id to export.", "error"); return; }
  try {
    const res = await fetch("/v1/runs/" + runId + "/export?format=" + format, {
      headers: { Authorization: "Bearer " + state.token },
    });
    if (!res.ok) {
      const payload = await res.json().catch(() => null);
      throw errorFromPayload(payload, res.status);
    }
    const blob = await res.blob();
    const disposition = res.headers.get("Content-Disposition") || "";
    const match = /filename="([^"]+)"/.exec(disposition);
    const filename = match ? match[1] : "costpilot-" + runId + "." + format;
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = filename;
    anchor.click();
    URL.revokeObjectURL(url);
    toast("Downloaded " + filename);
  } catch (err) {
    toastError(err);
    if (err.code === "E_EXPORT_FAILED") toast("JSON remains available as the alternate format.", null, 6000);
  }
}

async function openTrace(runId) {
  if (!runId) { toast("No run id on this card.", "error"); return; }
  openModal("Trace · " + runId, loadingBlock("Loading the calculation trace…"));
  try {
    const trace = await api("/v1/runs/" + runId + "/trace");
    openModal("Trace · " + runId, renderTrace(trace),
      h("div", { class: "split" },
        h("button", { class: "btn", onclick: () => reperform(runId) }, "Re-perform"),
        h("button", { class: "btn", onclick: () => downloadExport(runId, "xlsx") }, icon("excel", 13), "Excel working paper"),
        h("button", { class: "btn sm", onclick: () => downloadExport(runId, "json") }, "JSON")
      )
    );
  } catch (err) {
    openModal("Trace · " + runId, errorPanel(err));
  }
}

function renderTrace(trace) {
  if (!trace) return emptyBlock("No trace is available.");
  const wrap = h("div", {});
  const pins = trace.pins || {};
  wrap.appendChild(h("div", { class: "panel" },
    h("div", { class: "panel-head" }, h("h3", {}, "Run pins"), pill("read-only", "outline")),
    h("dl", { class: "kv" },
      h("dt", {}, "Run"), h("dd", {}, trace.run_id || ""),
      h("dt", {}, "Tool"), h("dd", {}, trace.tool || ""),
      h("dt", {}, "Question"), h("dd", {}, trace.question || ""),
      pins.snapshot_id ? h("dt", {}, "Snapshot") : null, pins.snapshot_id ? h("dd", {}, pins.snapshot_id) : null,
      pins.engine_version ? h("dt", {}, "Engine") : null, pins.engine_version ? h("dd", {}, pins.engine_version) : null,
      pins.rule_registry_version ? h("dt", {}, "Rule registry") : null, pins.rule_registry_version ? h("dd", {}, "v" + pins.rule_registry_version) : null,
      pins.rulebook_version ? h("dt", {}, "Rulebook") : null, pins.rulebook_version ? h("dd", {}, pins.rulebook_version) : null,
      trace.integrity && trace.integrity.event_hash ? h("dt", {}, "Audit hash") : null,
      trace.integrity && trace.integrity.event_hash ? h("dd", {}, trace.integrity.event_hash) : null
    )
  ));

  const steps = trace.steps || [];
  wrap.appendChild(h("div", { class: "section-title" }, "Calculation steps · " + steps.length));
  if (!steps.length) wrap.appendChild(emptyBlock("This run has no step-level trace."));
  steps.forEach((step, index) => {
    const details = h("details", { class: "trace-step", open: index < 2 });
    details.appendChild(h("summary", {},
      h("span", { class: "sid" }, step.step_id || "S" + (index + 1)),
      h("b", {}, step.label || step.rule_id || "Step"),
      h("span", { class: "val" }, step.display || step.value || "")
    ));
    const body = h("div", { class: "ts-body" });
    if (step.formula) body.appendChild(h("code", {}, step.formula));
    if (step.inputs && Object.keys(step.inputs).length) {
      const table = h("table", { class: "mini-table" });
      Object.entries(step.inputs).forEach(([key, value]) => {
        table.appendChild(h("tr", {}, h("td", {}, key), h("td", {}, String(value))));
      });
      body.appendChild(table);
    }
    if (step.rule_id) body.appendChild(h("div", { class: "small" }, "Rule " + step.rule_id + (step.rule_version ? " · v" + step.rule_version : "")));
    if (step.source_refs && step.source_refs.length) body.appendChild(h("div", { class: "small" }, "Sources: " + step.source_refs.join(", ")));
    if (step.note) body.appendChild(h("div", { class: "small" }, step.note));
    details.appendChild(body);
    wrap.appendChild(details);
  });

  if (trace.warnings && trace.warnings.length) {
    const details = h("details", { class: "block" });
    details.appendChild(h("summary", {}, "Warnings", h("span", { class: "count" }, trace.warnings.length)));
    details.appendChild(h("div", { class: "block-body" },
      trace.warnings.map((warning) => h("div", { class: "gate" }, h("div", { class: "g-main" }, h("b", {}, warning.message || warning.code || "Warning"))))
    ));
    wrap.appendChild(details);
  }
  if (trace.validation && trace.validation.ok === false) {
    wrap.appendChild(h("div", { class: "warn-box" }, "Validation reported a problem. Re-perform the run and inspect the steps."));
  }
  return wrap;
}

async function reperform(runId) {
  openModal("Re-performance · " + runId, loadingBlock("Recomputing from the pinned snapshot…"));
  try {
    const result = await api("/v1/runs/" + runId + "/reperform", { method: "POST", body: {} });
    const body = h("div", {});
    const tone = result.status === "exact" ? "ok-box" : result.status === "display_rounding" ? "warn-box" : "error-box";
    body.appendChild(h("div", { class: tone },
      h("b", {}, result.status === "exact" ? "Exact re-performance" : result.status === "display_rounding" ? "Display rounding only" : "Mismatch found"),
      h("div", {}, result.status === "exact"
        ? "Every stored step recomputed to the same decimal value from the pinned snapshot."
        : result.status === "display_rounding"
          ? "Every stored step matches within one cent; differences are display rounding."
          : "One or more steps did not reproduce. Inspect the mismatches before relying on this run.")
    ));
    if (result.components) {
      const table = h("table", { class: "data" });
      table.appendChild(h("thead", {}, h("tr", {}, h("th", {}, "Component"), h("th", {}, "Status"), h("th", {}, "Mismatches"), h("th", {}, "Rounding"))));
      const tbody = h("tbody");
      Object.entries(result.components).forEach(([name, comparison]) => {
        tbody.appendChild(h("tr", {},
          h("td", {}, name),
          h("td", {}, comparison.status || ""),
          h("td", {}, String((comparison.mismatches || []).length)),
          h("td", {}, String((comparison.display_rounding || []).length))
        ));
      });
      table.appendChild(tbody);
      body.appendChild(table);
    } else {
      const mismatches = result.mismatches || [];
      const rounding = result.display_rounding || [];
      if (mismatches.length || rounding.length) {
        const table = h("table", { class: "data" });
        table.appendChild(h("thead", {}, h("tr", {}, h("th", {}, "Step"), h("th", {}, "Stored"), h("th", {}, "Recomputed"), h("th", {}, "Kind"))));
        const tbody = h("tbody");
        mismatches.forEach((row) => tbody.appendChild(h("tr", {}, h("td", {}, row.step_id), h("td", {}, row.stored), h("td", {}, row.recomputed), h("td", {}, "mismatch"))));
        rounding.forEach((row) => tbody.appendChild(h("tr", {}, h("td", {}, row.step_id), h("td", {}, row.stored), h("td", {}, row.recomputed), h("td", {}, "rounding"))));
        table.appendChild(tbody);
        body.appendChild(table);
      } else {
        body.appendChild(h("div", { class: "small" }, "No step-level differences were recorded."));
      }
    }
    openModal("Re-performance · " + runId, body,
      h("div", { class: "split" },
        h("button", { class: "btn", onclick: () => openTrace(runId) }, "Open trace"),
        h("button", { class: "btn", onclick: () => downloadExport(runId, "xlsx") }, icon("excel", 13), "Excel working paper")
      )
    );
  } catch (err) {
    openModal("Re-performance · " + runId, errorPanel(err));
  }
}

async function openRun(runId) {
  openModal("Run · " + runId, loadingBlock("Opening the sealed run…"));
  try {
    const card = await api("/v1/runs/" + runId);
    if (card && card.verdict) {
      openModal("Run · " + runId, h("div", { style: { maxWidth: "820px", margin: "0 auto" } }, renderCard(card)),
        h("div", { class: "split" },
          h("button", { class: "btn", onclick: () => openTrace(runId) }, "Trace"),
          h("button", { class: "btn", onclick: () => reperform(runId) }, "Re-perform"),
          h("button", { class: "btn", onclick: () => downloadExport(runId, "xlsx") }, icon("excel", 13), "Excel")
        )
      );
    } else {
      openModal("Run · " + runId, h("pre", { class: "mono", style: { whiteSpace: "pre-wrap" } }, JSON.stringify(card, null, 2)));
    }
  } catch (err) {
    openModal("Run · " + runId, errorPanel(err));
  }
}

let drawerEl = null;
let modalEl = null;

function openDrawer(title, bodyNode) {
  closeDrawer();
  const body = h("div", { class: "drawer-body" }, bodyNode);
  const panel = h("aside", { class: "drawer", role: "dialog", "aria-modal": "true", "aria-label": title },
    h("header", { class: "drawer-head" },
      h("div", {}, h("div", { class: "eyebrow" }, "Workspace"), h("h2", {}, title)),
      h("button", { class: "icon-btn", "aria-label": "Close", onclick: closeDrawer }, icon("close", 18))
    ),
    body
  );
  drawerEl = h("div", { class: "drawer-root" }, h("div", { class: "scrim", onclick: closeDrawer }), panel);
  document.getElementById("overlay-root").appendChild(drawerEl);
  document.body.classList.add("locked");
  return body;
}

function closeDrawer() {
  if (drawerEl) { drawerEl.remove(); drawerEl = null; }

}

function openModal(title, bodyNode, footerNode) {
  closeModal();
  const body = h("div", { class: "modal-body" }, bodyNode);
  const panel = h("section", { class: "modal", role: "dialog", "aria-modal": "true", "aria-label": title },
    h("header", { class: "modal-head" },
      h("h2", {}, title),
      h("button", { class: "icon-btn", "aria-label": "Close", onclick: closeModal }, icon("close", 18))
    ),
    body,
    footerNode ? h("footer", { class: "modal-foot" }, footerNode) : null
  );
  modalEl = h("div", { class: "modal-root" }, h("div", { class: "scrim", onclick: closeModal }), panel);
  document.getElementById("overlay-root").appendChild(modalEl);
  document.body.classList.add("locked");
  return body;
}

function closeModal() {
  if (modalEl) { modalEl.remove(); modalEl = null; }
  if (!drawerEl) document.body.classList.remove("locked");
}

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    if (modalEl) closeModal();
    else if (drawerEl) closeDrawer();
    else toggleNav(false);
  }
});

function readinessChips(readiness) {
  if (!readiness) return null;
  const entries = Array.isArray(readiness) ? readiness.map((key) => [key, true]) : Object.entries(readiness);
  return h("div", { class: "chips" },
    entries.map(([key, ok]) => pill(sentenceCase(key), ok ? "green" : "outline"))
  );

async function openDataset() {
  const body = openDrawer("Dataset", loadingBlock("Loading the active dataset…"));
  try {
    const [listing, capability] = await Promise.all([api("/v1/datasets"), api("/v1/capabilities")]);
    state.datasetList = listing.datasets || [];
    state.dataset = listing.current || state.dataset;
    state.capability = capability;
    body.replaceChildren(buildDatasetBody(listing, capability, null));
    renderTopbar();
  } catch (err) {
    body.replaceChildren(errorPanel(err));
  }
}

function buildDatasetBody(listing, capability, uploadResult) {
  const current = listing.current || state.dataset || {};
  const fragment = h("div", {});

  if (uploadResult) {
    fragment.appendChild(h("div", { class: "ok-box" },
      h("b", {}, "Dataset activated · " + (uploadResult.dataset ? uploadResult.dataset.name : "")),
      h("div", {}, uploadResult.next || "Ask a question in the chat to analyse the new snapshot."),
      h("div", { class: "row-actions" },
        h("button", { class: "btn sm", onclick: () => { closeDrawer(); if (dom.input) dom.input.focus(); } }, "Start asking"),
        h("button", { class: "btn sm ghost", onclick: () => openRuns() }, "See runs")
      )
    ));
    if (uploadResult.remediation && uploadResult.remediation.length) {
      fragment.appendChild(h("div", { class: "warn-box" }, uploadResult.remediation.join(" ")));
    }
  }

  fragment.appendChild(h("div", { class: "panel" },
    h("div", { class: "panel-head" },
      h("div", {},
        h("div", { class: "eyebrow" }, "Active snapshot"),
        h("h3", {}, current.name || "Bundled demo dataset")
      ),
      pill(current.source === "upload" ? "uploaded" : "bundled", current.source === "upload" ? "green" : "neutral")
    ),
    h("dl", { class: "kv" },
      h("dt", {}, "Dataset ID"), h("dd", {}, current.dataset_id || ""),
      h("dt", {}, "Manifest hash"), h("dd", {}, current.manifest_hash || ""),
      h("dt", {}, "Currency"), h("dd", {}, current.currency || ""),
      h("dt", {}, "Rows"), h("dd", {}, (() => {
        const counts = current.row_counts || {};
        const total = Object.values(counts).reduce((sum, value) => sum + Number(value || 0), 0);
        return total ? total + " across " + Object.keys(counts).length + " tables" : "—";
      })())
    ),
    h("div", { class: "row-actions" },
      h("button", { class: "btn sm", onclick: () => downloadUrl("/v1/datasets/workbook-template", "costpilot-dataset-template.xlsx") }, icon("download", 13), "Workbook template"),
      h("button", { class: "btn sm ghost", onclick: () => send("What can you analyse on this dataset?") }, "Dataset capability")
    )
  ));

  fragment.appendChild(uploadPanel());

  const quality = (capability && capability.data_quality) || {};
  const gates = quality.gates || [];
  const gatePanel = h("div", { class: "panel" },
    h("div", { class: "panel-head" },
      h("h3", {}, "Data quality"),
      quality.blocking_gates ? pill(quality.blocking_gates + " blocking", "red") : pill("No blocking gates", "green")
    ),
    h("dl", { class: "kv" },
      h("dt", {}, "Tag coverage"), h("dd", {}, quality.tag_coverage_weighted ? (Number(quality.tag_coverage_weighted) * 100).toFixed(1) + "%" : "—"),
      h("dt", {}, "Reconciled"), h("dd", {}, quality.reconciled === undefined ? "—" : (quality.reconciled ? "yes" : "no")),
      h("dt", {}, "Warnings"), h("dd", {}, String(quality.warnings === undefined ? "—" : quality.warnings))
    )
  );
  if (gates.length) {
    const list = h("div", { style: { marginTop: "8px" } });
    gates.forEach((gate) => {
      list.appendChild(h("div", { class: "gate" },
        h("div", { class: "g-main" },
          h("b", {}, gate.name || gate.id || "Gate"),
          h("span", {}, gate.detail || ""),
          gate.remediation ? h("div", { class: "g-fix" }, gate.remediation) : null
        ),
        pill(gate.status || "", gate.status === "pass" ? "green" : gate.status === "warn" ? "amber" : "red")
      ));
    });
    gatePanel.appendChild(list);
  }
  fragment.appendChild(gatePanel);

  fragment.appendChild(h("div", { class: "panel" },
    h("div", { class: "panel-head" }, h("h3", {}, "Analysis readiness"), pill(capability && capability.currency ? capability.currency : "", "outline")),
    readinessChips(capability && capability.analysis_ready),
    h("div", { class: "row-actions" },
      h("button", { class: "btn sm ghost", onclick: () => { closeDrawer(); setComposer("Variance for PRD-B at PLT-01 in 2026-09"); } }, "Try a variance")
    )
  ));

  const history = listing.datasets || [];
  const historyPanel = h("div", { class: "panel" },
    h("div", { class: "panel-head" }, h("h3", {}, "Dataset history"), pill(history.length + " loaded", "neutral"))
  );
  if (!history.length) historyPanel.appendChild(emptyBlock("No stored datasets yet."));
  else {
    const list = h("div", { class: "side-list" });
    history.forEach((row) => {
      list.appendChild(h("div", { class: "run-row", style: { cursor: "default" } },
        h("div", { class: "r-main" },
          h("b", {}, row.name || row.dataset_id),
          h("span", {}, row.dataset_id + (row.uploaded_at ? " · " + fmtTime(row.uploaded_at) : "") + (row.source ? " · " + row.source : ""))
        ),
        row.current ? pill("current", "green") : pill("stored", "outline")
      ));
    });
    historyPanel.appendChild(list);
    historyPanel.appendChild(h("div", { class: "small", style: { marginTop: "8px" } },
      "Uploading a dataset activates it for the whole workspace. Previous snapshots stay addressed by content hash."));
  }
  fragment.appendChild(historyPanel);
  return fragment;
}

function uploadPanel() {
  const nameInput = h("input", { class: "input", placeholder: "Dataset name (optional)", id: "upload-name" });
  const result = h("div", { id: "upload-result" });
  const fileInput = h("input", { type: "file", accept: ".xlsx,.zip", class: "sr-only", id: "upload-file", onchange: (event) => {
    const file = event.target.files && event.target.files[0];
    if (file) doUpload(file, nameInput.value, result, zone);
  } });
  const zone = h("label", { class: "upload", for: "upload-file" },
    fileInput,
    h("div", { style: { display: "flex", justifyContent: "center" } }, icon("upload", 22)),
    h("h4", {}, "Drop an .xlsx workbook or a .zip of CSVs"),
    h("p", {}, "One sheet per canonical table. Required tables must have a header row."),
    h("div", { class: "small", style: { marginTop: "6px" } }, "or click to choose a file")
  );
  zone.addEventListener("dragover", (event) => { event.preventDefault(); zone.classList.add("drag"); });
  zone.addEventListener("dragleave", () => zone.classList.remove("drag"));
  zone.addEventListener("drop", (event) => {
    event.preventDefault();
    zone.classList.remove("drag");
    const file = event.dataTransfer.files && event.dataTransfer.files[0];
    if (file) doUpload(file, nameInput.value, result, zone);
  });

  const panel = h("div", { class: "panel" },
    h("div", { class: "panel-head" },
      h("div", {}, h("div", { class: "eyebrow" }, "Replace dataset"), h("h3", {}, "Upload a workbook")),
      can("run") ? pill("allowed", "green") : pill("needs analyst", "amber")
    ),
    h("div", { class: "field", style: { marginBottom: "8px" } }, h("label", { for: "upload-name" }, "Dataset name"), nameInput),
    zone,
    h("div", { class: "row-actions" },
      h("button", { class: "btn sm", onclick: () => downloadUrl("/v1/datasets/workbook-template", "costpilot-dataset-template.xlsx") }, icon("download", 13), "Download template")
    ),
    can("run")
      ? h("div", { class: "small", style: { marginTop: "8px" } }, "The upload is validated, content-addressed, and activated for every analyst. The demo dataset stays available as a stored snapshot.")
      : h("div", { class: "warn-box" }, "Your role cannot load a dataset. Sign in as an analyst, controller, or administrator to replace it. You can still download the template and export runs."),
    can("run") ? null : h("div", { class: "row-actions" }, h("button", { class: "btn sm", onclick: logout }, "Switch user")),
    result
  );
  return panel;
}

async function doUpload(file, name, resultSlot, zone) {
  resultSlot.replaceChildren(h("div", { class: "loading-block" }, h("span", { class: "spinner" }), "Uploading and validating " + file.name + "…"));
  zone.classList.add("drag");
  const form = new FormData();
  form.append("file", file);
  if (name && name.trim()) form.append("name", name.trim());
  try {
    const payload = await api("/v1/datasets/upload", { method: "POST", body: form });
    state.dataset = payload.dataset;
    state.datasetList = null;
    state.capability = await api("/v1/capabilities");
    const listing = await api("/v1/datasets");
    const created = await api("/v1/sessions", { method: "POST", body: { dataset_id: payload.dataset.dataset_id } });
    state.sessionId = created.session.session_id;
    state.messages = [];
    await loadSessions();
    renderAll();
    const drawerBody = openDrawer("Dataset", buildDatasetBody(listing, state.capability, payload));
    resultSlot = drawerBody;
    toast("Dataset activated · " + payload.dataset.name);
  } catch (err) {
    zone.classList.remove("drag");
    resultSlot.replaceChildren(errorPanel(err));
    if (err.code === "SCHEMA_MISMATCH") {
      toast("The workbook is missing required tables or columns. Fix the named tables and upload again.", "error", 6500);
    }
  }
}

async function downloadUrl(path, fallbackName) {
  try {
    const res = await fetch(path, { headers: { Authorization: "Bearer " + state.token } });
    if (!res.ok) {
      const payload = await res.json().catch(() => null);
      throw errorFromPayload(payload, res.status);
    }
    const blob = await res.blob();
    const disposition = res.headers.get("Content-Disposition") || "";
    const match = /filename="([^"]+)"/.exec(disposition);
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = match ? match[1] : fallbackName;
    anchor.click();
    URL.revokeObjectURL(url);
    toast("Downloaded " + (match ? match[1] : fallbackName));
  } catch (err) {
    toastError(err);
  }
}

async function openRuns() {
  const body = openDrawer("Runs", loadingBlock("Loading recent runs…"));
  try {
    const payload = await api("/v1/runs?limit=50");
    const runs = payload.runs || [];
    const fragment = h("div", {});
    fragment.appendChild(h("div", { class: "panel" },
      h("div", { class: "panel-head" }, h("h3", {}, "Sealed runs"), pill(runs.length + " recent", "neutral")),
      h("div", { class: "small" }, "Every run is a hash-chained audit event. Open a run to inspect the card, trace, or re-perform it.")
    ));
    if (!runs.length) fragment.appendChild(emptyBlock("No runs yet. Confirm an analysis to create the first one."));
    else {
      const list = h("div", { class: "side-list" });
      runs.forEach((run) => {
        list.appendChild(h("button", { class: "run-row", onclick: () => openRun(run.run_id) },
          h("div", { class: "r-main" },
            h("b", {}, truncate(run.question || run.tool || run.run_id, 70)),
            h("span", {}, run.run_id + " · " + fmtTime(run.created_at) + (run.user_id ? " · " + run.user_id : ""))
          ),
          pill(sentenceCase(run.intent || run.tool || ""), "outline")
        ));
      });
      fragment.appendChild(list);
    }
    body.replaceChildren(fragment);
  } catch (err) {
    body.replaceChildren(errorPanel(err));
  }
}

async function openTrust() {
  const body = openDrawer("Trust & audit", loadingBlock("Loading the rule registry…"));
  try {
    const rules = await api("/v1/registry/rules");
    const fragment = h("div", {});
    fragment.appendChild(h("div", { class: "panel" },
      h("div", { class: "panel-head" }, h("h3", {}, "Pins"), pill("immutable", "outline")),
      h("dl", { class: "kv" },
        h("dt", {}, "Dataset"), h("dd", {}, state.dataset ? state.dataset.name : ""),
        h("dt", {}, "Snapshot"), h("dd", {}, state.dataset ? state.dataset.dataset_id : ""),
        h("dt", {}, "Manifest hash"), h("dd", {}, state.dataset ? state.dataset.manifest_hash : ""),
        h("dt", {}, "Rulebook"), h("dd", {}, rules.rulebook_version || ""),
        h("dt", {}, "Rule registry"), h("dd", {}, "v" + (rules.registry_version || "")),
        h("dt", {}, "Rules registered"), h("dd", {}, String((rules.rules || []).length))
      )
    ));

    const verifySlot = h("div", { id: "verify-slot" });
    fragment.appendChild(h("div", { class: "panel" },
      h("div", { class: "panel-head" },
        h("div", {}, h("h3", {}, "Audit chain"), h("div", { class: "small" }, "SHA-256 chain over every sealed event.")),
        h("button", { class: "btn sm", onclick: () => verifyChain(verifySlot) }, "Verify chain")
      ),
      verifySlot
    ));

    const rulesPanel = h("div", { class: "panel" },
      h("div", { class: "panel-head" }, h("h3", {}, "Registered rules"), pill((rules.rules || []).length + " rules", "neutral"))
    );
    (rules.rules || []).forEach((rule) => {
      const details = h("details", { class: "block" });
      details.appendChild(h("summary", {}, (rule.id || "") + " · " + (rule.title || ""), h("span", { class: "count" }, "v" + (rule.version || ""))));
      const inner = h("div", { class: "block-body" });
      if (rule.formula) inner.appendChild(h("code", { class: "mono", style: { display: "block", whiteSpace: "pre-wrap", fontSize: "11px" } }, rule.formula));
      if (rule.module) inner.appendChild(h("div", { class: "small" }, "Module: " + rule.module));
      if (rule.citation) inner.appendChild(h("div", { class: "small" }, rule.citation));
      if (rule.golden_cases && rule.golden_cases.length) {
        inner.appendChild(h("div", { class: "chips" }, rule.golden_cases.map((name) => pill(name, "outline"))));
      }
      details.appendChild(inner);
      rulesPanel.appendChild(details);
    });
    fragment.appendChild(rulesPanel);
    body.replaceChildren(fragment);
  } catch (err) {
    body.replaceChildren(errorPanel(err));
  }
}

async function verifyChain(slot) {
  slot.replaceChildren(loadingBlock("Verifying every event hash…"));
  try {
    const result = await api("/v1/audit/verify");
    slot.replaceChildren(h("div", { class: result.ok ? "ok-box" : "error-box" },
      h("b", {}, result.ok ? "Chain intact" : "Chain broken"),
      h("div", {}, result.ok
        ? result.checked + " events verified against the previous hash."
        : "First break at " + (result.first_break || "unknown") + ": " + (result.reason || "hash mismatch") + "."),
      !result.ok ? h("div", { class: "row-actions" },
        h("button", { class: "btn sm", onclick: () => openRuns() }, "Inspect runs"),
        h("button", { class: "btn sm ghost", onclick: () => verifyChain(slot) }, "Verify again")
      ) : null
    ));
  } catch (err) {
    slot.replaceChildren(errorPanel(err));
  }
}

async function openSources() {
  const body = openDrawer("Sources", loadingBlock("Loading connectors and mappings…"));
  try {
    const [catalog, mappingPayload, accounts] = await Promise.all([
      api("/v1/connectors"),
      api("/v1/mappings"),
      api("/v1/registry/accounts?limit=300").catch(() => ({ accounts: [] })),
    ]);
    const mappings = mappingPayload.mappings || [];
    const fragment = h("div", {});

    fragment.appendChild(h("div", { class: "panel" },
      h("div", { class: "panel-head" },
        h("div", {}, h("h3", {}, "Read-only connectors"), h("div", { class: "small" }, "Extracts and reconciles; never writes back.")),
        pill("write back: " + (catalog.write_back ? "on" : "off"), "outline")
      )
    ));
    (catalog.connectors || []).forEach((connector) => {
      const output = h("div", {});
      fragment.appendChild(h("div", { class: "panel" },
        h("div", { class: "panel-head" },
          h("div", {}, h("h3", {}, connector.system || connector.name), h("div", { class: "small" }, connector.mode + " · contract v" + connector.contract_version)),
          h("button", { class: "btn sm", onclick: () => previewConnector(connector.name, output) }, "Preview")
        ),
        h("div", { class: "small" }, connector.extract || ""),
        output
      ));
    });

    const datalist = h("datalist", { id: "account-options" },
      (accounts.accounts || []).map((account) => h("option", { value: account.account_id || account.id || "" }, account.name || account.account_name || ""))
    );
    const sourceSystem = h("select", { class: "select", style: { width: "100%" }, id: "map-system" },
      (catalog.connectors || []).map((connector) => h("option", { value: connector.name }, connector.system + " (" + connector.name + ")"))
    );
    const sourceAccount = h("input", { class: "input", placeholder: "Source account", required: true, id: "map-account" });
    const sourceName = h("input", { class: "input", placeholder: "Source name (optional)", id: "map-name" });
    const targetAccount = h("input", { class: "input", placeholder: "Canonical account id", required: true, list: "account-options", id: "map-target" });
    const formMessage = h("div", { id: "mapping-form-message" });
    const form = h("form", { class: "panel", onsubmit: (event) => proposeMapping(event, formMessage) });
    form.append(
      h("div", { class: "panel-head" }, h("h3", {}, "Propose an account mapping"), can("run") ? pill("analyst or above", "green") : pill("view only", "amber")),
      datalist,
      h("div", { class: "field", style: { marginBottom: "7px" } }, h("label", { for: "map-system" }, "Source system"), sourceSystem),
      h("div", { class: "field", style: { marginBottom: "7px" } }, h("label", { for: "map-account" }, "Source account"), sourceAccount),
      h("div", { class: "field", style: { marginBottom: "7px" } }, h("label", { for: "map-name" }, "Source name"), sourceName),
      h("div", { class: "field", style: { marginBottom: "7px" } }, h("label", { for: "map-target" }, "Canonical account"), targetAccount),
      h("div", { class: "row-actions" },
        can("run")
          ? h("button", { class: "btn primary", type: "submit" }, "Propose mapping")
          : h("button", { class: "btn", type: "button", onclick: logout }, "Switch user"),
        h("span", { class: "small" }, can("run") ? "A controller must approve it." : "Sign in as an analyst to propose a mapping.")
      ),
      formMessage
    );
    fragment.appendChild(form);

    const mappingPanel = h("div", { class: "panel" },
      h("div", { class: "panel-head" }, h("h3", {}, "Account mappings"), pill(mappings.length + " rows", "neutral"))
    );
    if (!mappings.length) mappingPanel.appendChild(emptyBlock("No mappings yet."));
    else {
      const table = h("table", { class: "data" });
      table.appendChild(h("thead", {}, h("tr", {},
        h("th", {}, "System"), h("th", {}, "Source"), h("th", {}, "Canonical"), h("th", {}, "Status"), h("th", {}, "")
      )));
      const tbody = h("tbody");
      mappings.forEach((row) => {
        const tr = h("tr", {},
          h("td", {}, row.source_system),
          h("td", {}, row.source_account + (row.source_name ? " · " + row.source_name : "")),
          h("td", {}, row.target_account),
          h("td", {}, pill(row.status || "mapped", row.status === "approved" ? "green" : row.status === "pending" ? "amber" : "outline"))
        );
        const actionCell = h("td", {});
        if (row.proposal_id && row.status === "pending") {
          if (can("approve")) {
            actionCell.appendChild(h("button", { class: "btn sm", onclick: () => approveMapping(row.proposal_id) }, "Approve"));
          } else {
            actionCell.appendChild(h("button", { class: "btn sm", onclick: logout, title: "Only a controller or administrator can approve" }, "Controller needed"));
          }
        }
        tr.appendChild(actionCell);
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      mappingPanel.appendChild(table);
    }
    fragment.appendChild(mappingPanel);
    body.replaceChildren(fragment);
  } catch (err) {
    body.replaceChildren(errorPanel(err));
  }
}

async function previewConnector(name, slot) {
  slot.replaceChildren(loadingBlock("Extracting and reconciling…"));
  try {
    const payload = await api("/v1/connectors/" + encodeURIComponent(name) + "/preview", { method: "POST", body: {} });
    const result = payload.result || {};
    const wrapper = h("div", { style: { marginTop: "10px" } });
    wrapper.appendChild(h("div", { class: result.ok ? "ok-box" : "warn-box" },
      h("b", {}, result.ok ? "Reconciled" : "Reconciliation needs attention"),
      h("div", {}, (result.row_count || 0) + " extracted rows · contract v" + (result.contract_version || "") + " · write back " + (result.write_back ? "on" : "off"))
    ));
    (result.gates || []).forEach((gate) => {
      wrapper.appendChild(h("div", { class: "gate" },
        h("div", { class: "g-main" },
          h("b", {}, gate.name || gate.id || "Gate"),
          h("span", {}, gate.detail || ""),
          gate.remediation ? h("div", { class: "g-fix" }, gate.remediation) : null
        ),
        pill(gate.status || "", gate.status === "pass" ? "green" : gate.status === "warn" ? "amber" : "red")
      ));
    });
    if (payload.trace_ref && payload.trace_ref.run_id) {
      wrapper.appendChild(h("div", { class: "row-actions" },
        h("button", { class: "btn sm", onclick: () => openTrace(payload.trace_ref.run_id) }, "Open trace")
      ));
    }
    slot.replaceChildren(wrapper);
  } catch (err) {
    slot.replaceChildren(errorPanel(err));
  }
}

async function proposeMapping(event, message) {
  event.preventDefault();
  message.replaceChildren(loadingBlock("Proposing the mapping…"));
  try {
    const payload = await api("/v1/mappings", {
      method: "POST",
      body: {
        source_system: document.getElementById("map-system").value,
        source_account: document.getElementById("map-account").value.trim(),
        source_name: document.getElementById("map-name").value.trim(),
        target_account: document.getElementById("map-target").value.trim(),
      },
    });
    message.replaceChildren(h("div", { class: "ok-box" },
      h("b", {}, "Mapping proposed · " + (payload.proposal_id || payload.source_account)),
      h("div", {}, can("approve")
        ? "Approve it below to make it part of the read-only reconciliation."
        : "A controller or administrator must approve it before it is used."),
      !can("approve") ? h("div", { class: "row-actions" }, h("button", { class: "btn sm", onclick: logout }, "Switch to a controller")) : null
    ));
    setTimeout(() => openSources(), 650);
  } catch (err) {
    message.replaceChildren(errorPanel(err));
  }
}

async function approveMapping(proposalId) {
  try {
    await api("/v1/mappings/" + encodeURIComponent(proposalId) + "/approve", { method: "POST", body: {} });
    toast("Mapping approved · " + proposalId);
    openSources();
  } catch (err) {
    toastError(err);
  }
}
