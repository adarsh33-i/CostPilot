[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "costpilot"
version = "1.0.0"
description = "Deterministic management-accounting copilot with a sealed audit chain"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "openpyxl>=3.1",
  "reportlab>=4.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
]

[project.scripts]
costpilot = "costpilot.cli:main"

[tool.setuptools.packages.find]
include = ["costpilot*"]

[tool.setuptools.package-data]
"costpilot.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"costpilot/api/main.py" = ["B008"]
