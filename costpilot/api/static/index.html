<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CostPilot — management accounting chat</title>
<style>
:root{
  --paper:#f3efe6; --panel:#faf7f0; --card:#fffdf8; --ink:#182730; --ink-2:#41525c;
  --muted:#74828a; --line:#e2dbcd; --line-strong:#d3c9b7;
  --teal:#0e5b57; --teal-deep:#0a4744; --teal-weak:#e4efec;
  --amber:#9c641b; --amber-weak:#f7ecd9; --red:#9d3730; --red-weak:#f6e4e0;
  --green:#2f6b4f; --green-weak:#e3efe7; --blue:#335f80; --blue-weak:#e6eef5;
  --mono:"SF Mono","IBM Plex Mono",Menlo,Consolas,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(24,39,48,.05),0 10px 30px rgba(24,39,48,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  background-image:linear-gradient(rgba(24,39,48,.022) 1px,transparent 1px);background-size:100% 30px}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal);text-underline-offset:3px}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;letter-spacing:-.015em;margin:0}
p{margin:0 0 10px}
ul{margin:6px 0 0;padding-left:18px}
li{margin:2px 0}
.mono{font-family:var(--mono);font-size:12px}
.small{font-size:12px;color:var(--muted)}
.eyebrow{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:650}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.icon{display:inline-flex;align-items:center;justify-content:center}
.icon svg{display:block}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(380px,.95fr);align-items:stretch}
.login-hero{padding:64px clamp(28px,6vw,92px);display:flex;flex-direction:column;justify-content:space-between;gap:48px;
  background:
    radial-gradient(900px 500px at 8% -10%,rgba(14,91,87,.14),transparent 60%),
    radial-gradient(700px 420px at 100% 110%,rgba(156,100,27,.12),transparent 55%), var(--paper)}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:38px;height:38px;border-radius:11px;background:var(--teal);color:#f6f2e8;display:grid;place-items:center;
  font-family:var(--serif);font-size:17px;letter-spacing:-.04em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.brand-name{font-family:var(--serif);font-size:22px;letter-spacing:-.02em}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:-3px}
.login-hero h1{font-size:clamp(34px,4.6vw,54px);line-height:1.05;max-width:13ch}
.login-hero .lede{max-width:46ch;color:var(--ink-2);font-size:16px;margin-top:18px}
.proof{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:560px;margin-top:34px}
.proof div{border-top:1px solid var(--line-strong);padding-top:10px}
.proof strong{display:block;font-size:13px;letter-spacing:.01em}
.proof span{font-size:12px;color:var(--muted)}
.login-panel{background:var(--panel);border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:48px 30px}
.login-card{width:min(400px,100%)}
.login-card h2{font-size:27px;margin-bottom:6px}
.login-card form{display:grid;gap:14px;margin-top:22px}
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:650;letter-spacing:.02em;color:var(--ink-2)}
.input{width:100%;border:1px solid var(--line-strong);background:var(--card);border-radius:10px;padding:10px 12px;outline:none;
  transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,91,87,.12)}
.demo{margin-top:24px;border-top:1px solid var(--line);padding-top:16px}
.demo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.demo-btn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--line);background:var(--card);
  border-radius:9px;padding:8px 10px;cursor:pointer;text-align:left}
.demo-btn:hover{border-color:var(--teal);background:var(--teal-weak)}
.demo-btn b{font-size:12.5px;font-weight:650;text-transform:capitalize}
.demo-btn span{font-size:11px;color:var(--muted)}
.login-foot{margin-top:18px;font-size:11.5px;color:var(--muted)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);height:100vh;overflow:hidden}
.sidebar{display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,#f8f4ec,#f2ede3);
  border-right:1px solid var(--line);padding:16px 12px 12px;min-height:0}
.side-top{display:flex;align-items:center;gap:10px;padding:2px 6px 4px}
.side-top .brand-name{font-size:18px}
.side-top .brand-sub{font-size:9px;letter-spacing:.05em;white-space:nowrap}
.side-top .mark{width:31px;height:31px;border-radius:9px;font-size:14px}
.new-chat{border:1px solid var(--line-strong);background:var(--card);border-radius:10px;padding:9px 12px;display:flex;align-items:center;
  gap:8px;cursor:pointer;font-weight:600;font-size:13px;box-shadow:0 1px 0 rgba(24,39,48,.04)}
.new-chat:hover{border-color:var(--teal);background:var(--teal-weak);color:var(--teal-deep)}
.side-label{padding:6px 8px 0;display:flex;align-items:center;justify-content:space-between}
.session-list{flex:1;min-height:80px;overflow:auto;display:flex;flex-direction:column;gap:2px;padding:2px 2px}
.session{display:flex;flex-direction:column;gap:1px;border:0;background:transparent;border-radius:8px;padding:7px 9px;cursor:pointer;text-align:left;color:var(--ink-2)}
.session:hover{background:rgba(14,91,87,.06)}
.session.active{background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.session b{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.session span{font-size:10.5px;color:var(--muted)}
.side-tools{display:grid;gap:2px;border-top:1px solid var(--line);padding-top:8px}
.tool{display:flex;align-items:center;gap:9px;border:0;background:transparent;border-radius:8px;padding:7px 9px;cursor:pointer;
  font-size:12.5px;color:var(--ink-2);text-align:left}
.tool:hover{background:rgba(24,39,48,.055);color:var(--ink)}
.tool small{margin-left:auto;font-size:10.5px;color:var(--muted)}
.user-chip{display:flex;align-items:center;gap:9px;border-top:1px solid var(--line);padding:10px 6px 0}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--teal-weak);color:var(--teal-deep);display:grid;place-items:center;
  font-size:12px;font-weight:700}
.user-meta{min-width:0;flex:1}
.user-meta b{display:block;font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-meta span{font-size:10.5px;color:var(--muted);text-transform:capitalize}
.icon-btn{border:1px solid transparent;background:transparent;border-radius:8px;padding:6px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:rgba(24,39,48,.07);color:var(--ink);border-color:var(--line)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--paper)}
.topbar{height:58px;flex:0 0 auto;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px;
  background:rgba(243,239,230,.92);backdrop-filter:blur(6px)}
.topbar .title{min-width:0;flex:1}
.topbar .title b{display:block;font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dataset-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:3px 9px;font-size:11px;color:var(--ink-2);cursor:pointer;max-width:320px}
.dataset-pill:hover{border-color:var(--teal);color:var(--teal-deep)}
.dataset-pill b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.model-wrap{display:flex;align-items:center;gap:8px;position:relative}
.model-wrap label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.select{border:1px solid var(--line-strong);background:var(--card);border-radius:9px;padding:6px 26px 6px 10px;font-size:12px;
  appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  cursor:pointer;max-width:240px;outline:none}
.select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,91,87,.1)}
.local-note{font-size:10.5px;color:var(--muted);white-space:nowrap}
.menu-btn{display:none}

.thread{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;padding:28px 24px 12px}
.thread{scrollbar-color:var(--line-strong) transparent}
.msg{display:flex;gap:12px;margin:0 auto 22px;width:min(880px,100%)}
.msg.user{justify-content:flex-end}
.msg.user .bubble{max-width:min(620px,86%);background:var(--teal);color:#f7f4ec;border-radius:16px 16px 4px 16px;padding:10px 14px;
  white-space:pre-wrap;box-shadow:0 1px 2px rgba(14,91,87,.2)}
.avatar{width:28px;height:28px;flex:0 0 28px;border-radius:8px;background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--serif);font-size:11.5px;color:var(--teal-deep);margin-top:2px}
.msg-body{min-width:0;flex:1;max-width:calc(100% - 40px)}
.msg-text{white-space:pre-wrap;font-size:14.5px;color:var(--ink)}
.msg-meta{font-size:10.5px;color:var(--muted);margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.msg-meta .mono{font-size:10.5px;color:var(--muted)}
.note{border-left:3px solid var(--amber);background:var(--amber-weak);border-radius:0 8px 8px 0;padding:7px 10px;font-size:12px;
  color:#6c4814;margin-top:10px}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;padding:4px 0}
.dots{display:inline-flex;gap:4px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--teal);opacity:.35;animation:pulse 1.1s infinite}
.dots i:nth-child(2){animation-delay:.16s}.dots i:nth-child(3){animation-delay:.32s}
@keyframes pulse{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:.9;transform:translateY(-2px)}}
.spinner{width:14px;height:14px;border:2px solid rgba(24,39,48,.18);border-top-color:var(--teal);border-radius:50%;
  animation:spin .7s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- hero ---------- */
.hero{padding:34px 0 10px;max-width:760px;margin:0 auto}
.hero h1{font-size:clamp(30px,3.6vw,42px);line-height:1.08}
.hero p{color:var(--ink-2);margin-top:12px;max-width:58ch}
.hero .dataset-line{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.starters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:26px}
.starter{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 13px;cursor:pointer;text-align:left;
  display:flex;flex-direction:column;gap:2px;transition:border-color .15s,transform .15s,box-shadow .15s}
.starter:hover{border-color:var(--teal);transform:translateY(-1px);box-shadow:var(--shadow)}
.starter b{font-size:12.5px;font-weight:650}
.starter span{font-size:11.5px;color:var(--muted)}

/* ---------- composer ---------- */
.composer-wrap{flex:0 0 auto;padding:10px 24px 16px;background:linear-gradient(180deg,rgba(243,239,230,0),var(--paper) 32%)}
.composer{width:min(880px,100%);margin:0 auto;border:1px solid var(--line-strong);background:var(--card);border-radius:16px;
  padding:8px 8px 8px 6px;box-shadow:var(--shadow);display:flex;align-items:flex-end;gap:6px}
.composer:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,91,87,.1),var(--shadow)}
.composer textarea{flex:1;border:0;background:transparent;resize:none;outline:none;padding:8px 8px;max-height:190px;min-height:38px;
  font-size:14.5px;line-height:1.45}
.composer .icon-btn{flex:0 0 auto;padding:8px}
.send-btn{flex:0 0 auto;width:34px;height:34px;border-radius:10px;border:0;background:var(--teal);color:#f7f4ec;display:grid;
  place-items:center;cursor:pointer;margin:2px}
.send-btn:hover{background:var(--teal-deep)}
.send-btn:disabled{opacity:.45;cursor:not-allowed}
.composer-hint{width:min(880px,100%);margin:7px auto 0;display:flex;justify-content:space-between;gap:10px;font-size:10.5px;color:var(--muted)}

/* ---------- buttons, pills ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--card);border-radius:9px;
  padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-2);transition:background .12s,border-color .12s,color .12s}
.btn:hover{border-color:var(--teal);color:var(--teal-deep);background:var(--teal-weak)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#f7f4ec}
.btn.primary:hover{background:var(--teal-deep);border-color:var(--teal-deep);color:#fffdf6}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:rgba(24,39,48,.06);border-color:transparent;color:var(--ink)}
.btn.danger{color:var(--red);border-color:#e3c6c0}
.btn.danger:hover{background:var(--red-weak);border-color:var(--red);color:var(--red)}
.btn.sm{padding:4px 8px;font-size:11px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn .spinner{width:12px;height:12px;border-width:2px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:650;
  letter-spacing:.02em;border:1px solid transparent;white-space:nowrap}
.pill.neutral{background:rgba(24,39,48,.055);color:var(--ink-2)}
.pill.teal{background:var(--teal-weak);color:var(--teal-deep)}
.pill.amber{background:var(--amber-weak);color:#6c4814}
.pill.red{background:var(--red-weak);color:#7d2721}
.pill.green{background:var(--green-weak);color:#245640}
.pill.blue{background:var(--blue-weak);color:#274d68}
.pill.outline{background:transparent;border-color:var(--line-strong);color:var(--muted)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-top:12px;overflow:hidden}
.card-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.card-head .h{min-width:0}
.card-head h3{font-size:18px;margin-top:2px}
.card-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.card-body{padding:14px 16px}
.card-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:11px 16px;border-top:1px solid var(--line);background:#fdfbf5}
.card-foot .grow{flex:1}
.meta-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.verdict{border-radius:10px;padding:12px 14px;border:1px solid var(--line);background:#fcfaf4;font-family:var(--serif);font-size:17px;line-height:1.45}
.verdict.adverse{background:var(--red-weak);border-color:#e6c7c1;color:#6f231d}
.verdict.favorable{background:var(--green-weak);border-color:#c8dfd2;color:#1f4e39}
.verdict.neutral{background:var(--blue-weak);border-color:#cdddec;color:#274d68}
.verdict .v-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;background:var(--card);border:1px solid var(--line);
  border-radius:10px;overflow:hidden;margin-top:12px}
.fact{background:var(--card);padding:10px 12px;box-shadow:inset -1px -1px 0 0 var(--line)}
.fact .k{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:650}
.fact .v{font-family:var(--mono);font-size:14px;margin-top:2px;color:var(--ink);word-break:break-word}
.section-title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:650;margin:16px 0 7px}
details.block{border:1px solid var(--line);border-radius:10px;margin-top:10px;background:#fdfbf5;overflow:hidden}
details.block>summary{cursor:pointer;list-style:none;padding:9px 12px;font-size:12.5px;font-weight:650;display:flex;gap:8px;align-items:center;color:var(--ink-2)}
details.block>summary::-webkit-details-marker{display:none}
details.block>summary:before{content:"›";font-size:15px;line-height:1;color:var(--muted);transition:transform .15s}
details.block[open]>summary:before{transform:rotate(90deg)}
details.block>summary .count{margin-left:auto;font-size:10.5px;color:var(--muted);font-weight:500}
details.block .block-body{padding:0 12px 12px}
table.data{width:100%;border-collapse:collapse;font-size:11.5px}
table.data th{text-align:left;font-weight:650;color:var(--muted);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:6px 8px;border-bottom:1px solid #eee8dc;vertical-align:top;font-family:var(--mono);font-size:11.5px}
table.data tr:last-child td{border-bottom:0}
table.data td:first-child{font-family:var(--sans);font-size:12px;color:var(--ink-2)}
.empty{padding:14px;color:var(--muted);font-size:12px}

/* ---------- plan ---------- */
.plan-card{border-color:#cfdad4}
.plan-card .card-head{background:linear-gradient(180deg,#f3f8f5,#fffdf8)}
.sheet{border-top:1px solid var(--line)}
.sheet-row{display:grid;grid-template-columns:minmax(150px,190px) minmax(120px,1fr) 128px;gap:10px;align-items:center;padding:8px 16px;
  border-bottom:1px solid #efe9dd}
.sheet-row:last-child{border-bottom:0}
.sheet-row .lbl{font-size:12.5px;color:var(--ink-2);font-weight:600}
.sheet-row .src{display:flex;justify-content:flex-start;gap:4px;flex-wrap:wrap}
.sheet-row input,.sheet-row select{width:100%;border:1px solid var(--line);background:#fffdf8;border-radius:7px;padding:5px 8px;
  font-family:var(--mono);font-size:12px;outline:none}
.sheet-row input:focus,.sheet-row select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,91,87,.1)}
.sheet-row .plain{font-family:var(--mono);font-size:12px;padding:5px 0;color:var(--ink-2);word-break:break-word}
.sheet-warning{grid-column:1 / -1;border-left:3px solid var(--amber);background:var(--amber-weak);border-radius:0 7px 7px 0;
  padding:7px 10px;font-size:11.5px;color:#6c4814}
.clarify-note{padding:12px 16px;background:#fdfbf5;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.option-grid{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* ---------- panels, drawers, modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(24,39,48,.34);backdrop-filter:blur(1.5px);z-index:40;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer-root{position:fixed;inset:0;z-index:41;pointer-events:none}
.drawer{pointer-events:auto;position:absolute;top:0;right:0;height:100%;width:min(560px,100%);background:var(--panel);
  border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(24,39,48,.16);animation:slide .2s ease}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer-head h2{font-size:22px}
.drawer-body{flex:1;overflow-y:auto;padding:18px}
.modal-root{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:28px}
.modal{position:relative;z-index:51;width:min(940px,100%);max-height:88vh;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;box-shadow:0 30px 90px rgba(24,39,48,.3);display:flex;flex-direction:column;overflow:hidden;animation:rise .18s ease}
@keyframes rise{from{transform:translateY(8px);opacity:.5}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:19px}
.modal-body{overflow-y:auto;padding:16px 18px}

  align-items:center;pointer-events:none}

  max-width:min(560px,92vw);animation:rise .18s ease;pointer-events:auto}

<body>
<div id="app"></div>
<div id="overlay-root"></div>
<div id="toast-root" class="toast-root"></div>
<script>
"use strict";

/* ------------------------------------------------------------------ */
/* helpers                                                             */
/* ------------------------------------------------------------------ */

const LS_TOKEN = "costpilot.token";
const LS_MODEL = "costpilot.model";

const state = {
  token: localStorage.getItem(LS_TOKEN) || "",
  user: null,
  models: [],
  model: localStorage.getItem(LS_MODEL) || "",
  modelNote: "",
  sessionId: null,
  sessions: [],
  messages: [],
  capability: null,
  dataset: null,
  datasetList: null,
  sending: false,
  lastQuestion: "",
  lastRun: null,
  pendingNotice: "",
};

const dom = {};

function h(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  attrs = attrs || {};
  let pendingValue;
  for (const key of Object.keys(attrs)) {
    const value = attrs[key];
    if (value === undefined || value === null || value === false) continue;
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else if (key === "style" && typeof value === "object") Object.assign(node.style, value);
    else if (key === "dataset") Object.assign(node.dataset, value);
    else if (key === "value") pendingValue = value;
    else if (key === "for") node.setAttribute("for", value);
    else if (key.startsWith("on") && typeof value === "function") node.addEventListener(key.slice(2).toLowerCase(), value);
    else if (key in node) {
      try { node[key] = value; } catch (err) { node.setAttribute(key, value); }
    } else node.setAttribute(key, value);
  }
  appendKids(node, kids);
  if (pendingValue !== undefined) {
    if (["INPUT", "SELECT", "TEXTAREA"].includes(node.tagName)) node.value = pendingValue;
    else if (node.tagName === "OPTION") node.setAttribute("value", String(pendingValue));
  }
  return node;
}

function appendKids(node, kids) {
  for (const kid of kids) {
    if (Array.isArray(kid)) { appendKids(node, kid); continue; }
    if (kid === null || kid === undefined || kid === false) continue;
    node.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
}

const ICONS = {
  plus: '<path d="M12 5v14M5 12h14"/>',
  send: '<path d="M4.5 12.5 20 4l-5.5 16-3.2-6.1L4.5 12.5Z"/><path d="m11.3 13.9 8.7-9.9"/>',
  close: '<path d="M6 6l12 12M18 6 6 18"/>',
  menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
  database: '<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',
  activity: '<path d="M3 12h4l2.5-6 4 12L16 12h5"/>',
  shield: '<path d="M12 3l7 3v5.5c0 4.4-3 8-7 9.5-4-1.5-7-5.1-7-9.5V6l7-3Z"/><path d="m9 12 2 2 4-4"/>',
  plug: '<path d="M9 3v5M15 3v5"/><path d="M6 8h12v2a6 6 0 0 1-6 6 6 6 0 0 1-6-6V8Z"/><path d="M12 16v5"/>',
  upload: '<path d="M12 16V4m0 0L7 9m5-5 5 5"/><path d="M4 16v3h16v-3"/>',
  download: '<path d="M12 4v12m0 0 5-5m-5 5-5-5"/><path d="M4 16v3h16v-3"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5h10"/>',
  logout: '<path d="M15 4h4v16h-4"/><path d="M10 8 6 12l4 4"/><path d="M6 12h9"/>',
  excel: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="m8 9 8 6M16 9l-8 6"/>',
};

function icon(name, size) {
  const span = document.createElement("span");
  span.className = "icon";
  span.innerHTML = '<svg viewBox="0 0 24 24" width="' + (size || 16) + '" height="' + (size || 16) +
    '" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
    (ICONS[name] || "") + "</svg>";
  return span;
}

function fmtTime(iso) {
  if (!iso) return "";
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return iso;
  return date.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

function truncate(text, n) {
  const value = String(text || "").replace(/\s+/g, " ").trim();
  return value.length > n ? value.slice(0, n - 1) + "…" : value;
}

function can(permission) {
  return !!(state.user && (state.user.permissions || []).includes(permission));
}

function toast(message, kind, ms) {
  const root = document.getElementById("toast-root");
  const node = h("div", { class: "toast" + (kind === "error" ? " err" : "") }, message);
  root.appendChild(node);
  setTimeout(() => { node.style.opacity = "0"; node.style.transition = "opacity .2s"; }, ms || 3600);
  setTimeout(() => node.remove(), (ms || 3600) + 240);
}

function toastError(err) {
  const message = err && err.message ? err.message : "Something went wrong.";
  const fix = err && err.remediation && err.remediation[0] ? " " + err.remediation[0] : "";
  toast(message + fix, "error", 5200);
}

function errorFromPayload(payload, status) {
  const err = new Error(
    (payload && payload.error && payload.error.message) || ("Request failed (" + status + ")")
  );
  err.code = (payload && payload.error && payload.error.code) || ("HTTP_" + status);
  err.remediation = (payload && payload.remediation) || [];
  err.actions = (payload && payload.actions) || [];
  err.status = status;
  return err;
}

async function api(path, opts) {
  opts = opts || {};
  const headers = Object.assign({}, opts.headers || {});
  if (state.token) headers.Authorization = "Bearer " + state.token;
  let body = opts.body;
  if (body && !(body instanceof FormData)) {
    headers["Content-Type"] = "application/json";
    body = JSON.stringify(body);
  }
  let res;
  try {
    res = await fetch(path, { method: opts.method || "GET", headers, body });
  } catch (err) {
    const net = new Error("Cannot reach the CostPilot service. It may not be running.");
    net.code = "NETWORK";
    net.remediation = ["Start the API with uvicorn costpilot.api.main:app, then retry."];
    net.actions = [{ action: "retry", label: "Retry" }];
    throw net;
  }
  const type = res.headers.get("content-type") || "";
  let payload = null;
  if (type.includes("application/json")) payload = await res.json().catch(() => null);
  else payload = await res.text().catch(() => "");
  if (!res.ok) throw errorFromPayload(payload, res.status);
  return payload;
}

function loadingBlock(text) {
  return h("div", { class: "loading-block" }, h("span", { class: "spinner" }), text || "Working…");
}

function emptyBlock(text) {
  return h("div", { class: "empty" }, text);
}

function pill(text, tone) {
  return h("span", { class: "pill " + (tone || "neutral") }, text);
}

function sentenceCase(value) {
  const text = String(value || "").replace(/_/g, " ");
  return text.charAt(0).toUpperCase() + text.slice(1);
}

/* ------------------------------------------------------------------ */
/* auth                                                               */
/* ------------------------------------------------------------------ */

function logout() {
  if (state.token) api("/v1/auth/logout", { method: "POST", body: {} }).catch(() => {});
  state.token = "";
  state.user = null;
  state.sessionId = null;
  state.messages = [];
  state.sessions = [];
  localStorage.removeItem(LS_TOKEN);
  closeDrawer();
  closeModal();
  Object.keys(dom).forEach((key) => { delete dom[key]; });
  renderLogin();
}

function renderLogin(notice) {
  closeDrawer();
  closeModal();
  const message = notice || state.pendingNotice || "";
  state.pendingNotice = "";
  const form = h("form", { onsubmit: (event) => submitLogin(event) });
  const userInput = h("input", { class: "input", id: "login-user", name: "user", autocomplete: "username", value: "controller", required: true });
  const passInput = h("input", { class: "input", id: "login-pass", name: "password", type: "password", autocomplete: "current-password", value: "costpilot", required: true });
  const errorSlot = h("div", { id: "login-error" });
  const submit = h("button", { class: "btn primary", type: "submit", style: { justifyContent: "center", padding: "10px 14px" } }, "Sign in");

  form.append(
    h("div", { class: "field" }, h("label", { for: "login-user" }, "User"), userInput),
    h("div", { class: "field" }, h("label", { for: "login-pass" }, "Password"), passInput),
    errorSlot,
    submit
  );

  const demos = [
    ["viewer", "Viewer · read and export"],
    ["analyst", "Analyst · run analyses"],
    ["controller", "Controller · confirm and approve"],
    ["admin", "Admin · configure"],
  ].map(([user, label]) =>
    h("button", {
      class: "demo-btn",
      type: "button",
      onclick: () => { userInput.value = user; passInput.value = "costpilot"; userInput.focus(); },
    }, h("b", {}, user), h("span", {}, label))
  );

  const page = h("main", { class: "login" },
    h("section", { class: "login-hero" },
      h("div", {},
        h("div", { class: "brand" },
          h("div", { class: "mark" }, "CP"),
          h("div", {}, h("div", { class: "brand-name" }, "CostPilot"), h("div", { class: "brand-sub" }, "management accounting"))
        ),
        h("h1", { style: { marginTop: "56px" } }, "Ask the question. The engine keeps the ledger honest."),
        h("p", { class: "lede" },
          "A free local model reads your question and picks a registered analysis. The rule engine calculates every number, " +
          "cites the formula, and seals the run in an append-only audit chain."
        ),
        h("div", { class: "proof" },
          h("div", {}, h("strong", {}, "AI plans, engine calculates"), h("span", {}, "No model arithmetic, ever.")),
          h("div", {}, h("strong", {}, "Excel working paper"), h("span", {}, "Formula, inputs and sources on every sheet.")),
          h("div", {}, h("strong", {}, "Your data, on your machine"), h("span", {}, "Ollama models run locally and free.")),
          h("div", {}, h("strong", {}, "Read-only connectors"), h("span", {}, "Nothing is written back to the ledger."))
        )
      ),
      h("div", { class: "small" }, "CostPilot · deterministic management-accounting platform")
    ),
    h("section", { class: "login-panel" },
      h("div", { class: "login-card" },
        h("h2", {}, "Sign in"),
        h("p", { class: "small" }, "Use a demo account, or the account your administrator provisioned."),
        message ? h("div", { class: "warn-box" }, message) : null,
        form,
        h("div", { class: "demo" },
          h("div", { class: "eyebrow" }, "Demo accounts · password costpilot"),
          h("div", { class: "demo-grid" }, demos)
        ),
        h("p", { class: "login-foot" },
          "Demo credentials come from COSTPILOT_USERS and COSTPILOT_DEMO_PASSWORD. Replace local auth with OIDC before production."
        )
      )
    )
  );
  document.getElementById("app").replaceChildren(page);
  setTimeout(() => userInput.focus(), 30);
}

async function submitLogin(event) {
  event.preventDefault();
  const form = event.currentTarget;
  const errorSlot = document.getElementById("login-error");
  const button = form.querySelector('button[type="submit"]');
  errorSlot.replaceChildren();
  button.disabled = true;
  button.replaceChildren(h("span", { class: "spinner" }), " Signing in…");
  try {
    const payload = await api("/v1/auth/login", {
      method: "POST",
      body: {
        user_id: document.getElementById("login-user").value.trim(),
        password: document.getElementById("login-pass").value,
      },
    });
    state.token = payload.token;
    localStorage.setItem(LS_TOKEN, payload.token);
    state.user = payload.user;
    await init();
  } catch (err) {
    errorSlot.replaceChildren(
      h("div", { class: "error-box" },
        h("div", { class: "e-head" }, h("b", {}, err.code || "Sign-in failed")),
        h("p", {}, err.message),
        err.remediation && err.remediation.length ? h("ul", {}, err.remediation.map((line) => h("li", {}, line))) : null
      )
    );
    button.disabled = false;
    button.replaceChildren("Sign in");
  }
}

/* ------------------------------------------------------------------ */
/* boot                                                               */
/* ------------------------------------------------------------------ */

async function init() {
  try {
    const me = await api("/v1/auth/me");
    state.user = me.user;
  } catch (err) {
    if (err.status === 401) {
      state.token = "";
      localStorage.removeItem(LS_TOKEN);
      renderLogin("Your session expired. Sign in again to continue.");
      return;
    }
    renderLogin("CostPilot could not load your session: " + err.message + " " + (err.remediation || []).join(" "));
    return;
  }
  await loadModels();
  await Promise.all([loadSessions(), loadDataset(), loadCapability()]);
  if (!state.sessionId) {
    try {
      const created = await api("/v1/sessions", { method: "POST", body: {} });
      state.sessionId = created.session.session_id;
    } catch (err) {
      state.sessionId = null;
    }
  }
  await loadThread();
  mountShell();
  renderAll();
}

async function loadModels() {
  try {
    const catalog = await api("/v1/models");
    state.models = catalog.models || [];
    state.modelNote = catalog.note || "";
    const ids = state.models.map((row) => row.id);
    if (!state.model || !ids.includes(state.model)) state.model = catalog.default || "deterministic";
    if (!ids.includes(state.model)) state.model = "deterministic";
    localStorage.setItem(LS_MODEL, state.model);
  } catch (err) {
    state.models = [{ id: "deterministic", label: "Deterministic planner", provider: "costpilot", free: true, local: true }];
    state.model = "deterministic";
    state.modelNote = "The model catalog is unavailable. The deterministic planner still runs every analysis.";
  }
}

async function loadSessions() {
  try {
    const payload = await api("/v1/sessions?limit=30");
    state.sessions = payload.sessions || [];
    if (!state.sessionId && state.sessions.length) state.sessionId = state.sessions[0].session_id;
  } catch (err) {
    state.sessions = [];
  }
}

async function loadDataset() {
  try {
    const payload = await api("/v1/datasets");
    state.datasetList = payload.datasets || [];
    state.dataset = payload.current || (state.datasetList.find((row) => row.current)) || null;
  } catch (err) {
    state.dataset = state.dataset || null;
  }
}

async function loadCapability() {
  try {
    state.capability = await api("/v1/capabilities");
  } catch (err) {
    state.capability = state.capability || null;
  }
}

async function loadThread() {
  state.messages = [];
  if (!state.sessionId) return;
  let detail;
  try {
    detail = await api("/v1/sessions/" + state.sessionId);
  } catch (err) {
    return;
  }
  const rows = detail.messages || [];
  const built = [];
  for (const row of rows) {
    const item = { role: row.role, text: row.text, at: row.created_at, planId: row.plan_id, runId: row.run_id };
    if (row.role === "assistant" && row.run_id) {
      try { item.card = await api("/v1/runs/" + row.run_id); } catch (err) { /* card stays unavailable */ }
    }
    if (row.role === "assistant" && row.plan_id && !row.run_id) {
      try {
        const info = await api("/v1/plans/" + row.plan_id);
        item.plan = info.plan;
        item.sheet = info.parameter_sheet || [];
        item.status = info.plan.status;
      } catch (err) { /* plan stays unavailable */ }
    }
    built.push(item);
  }
  state.messages = built;
}

/* ------------------------------------------------------------------ */
/* shell                                                              */
/* ------------------------------------------------------------------ */

function mountShell() {
  const sessionsBox = h("div", { class: "session-list", id: "session-list" });
  const tools = h("div", { class: "side-tools" });
  const tool = (name, label, action) =>
    h("button", { class: "tool", onclick: action }, icon(name, 15), label);
  tools.append(
    tool("database", "Dataset", () => openDataset()),
    tool("activity", "Runs", () => openRuns()),
    tool("shield", "Trust & audit", () => openTrust()),
    tool("plug", "Sources", () => openSources())
  );

  const userBox = h("div", { class: "user-chip", id: "user-chip" });
  const sidebar = h("aside", { class: "sidebar" },
    h("div", { class: "side-top" },
      h("div", { class: "mark" }, "CP"),
      h("div", {}, h("div", { class: "brand-name" }, "CostPilot"), h("div", { class: "brand-sub" }, "management accounting")),
      h("button", { class: "icon-btn menu-btn", "aria-label": "Close menu", onclick: () => toggleNav(false) }, icon("close"))
    ),
    h("button", { class: "new-chat", onclick: newChat }, icon("plus", 15), "New analysis"),
    h("div", { class: "side-label" }, h("span", { class: "eyebrow" }, "Conversations")),
    sessionsBox,
    tools,
    userBox
  );

  const topTitle = h("div", { class: "title" });
  const modelSelect = h("select", { class: "select", id: "model-select", "aria-label": "Model", onchange: (event) => chooseModel(event.target.value) });
  const modelBadge = h("span", { class: "local-note", id: "model-note" });
  const topbar = h("header", { class: "topbar" },
    h("button", { class: "icon-btn menu-btn", "aria-label": "Open menu", onclick: () => toggleNav(true) }, icon("menu", 18)),
    topTitle,
    h("div", { class: "model-wrap" }, h("label", { for: "model-select" }, "Model"), modelSelect, modelBadge)
  );

  const thread = h("div", { class: "thread", id: "thread" });
  const input = h("textarea", {
    id: "composer",
    rows: 1,
    placeholder: "Ask about a variance, a special order, customer margin, or the budget…",
    onkeydown: (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        send(input.value);
      }
    },
    oninput: () => autoGrow(input),
  });
  const sendBtn = h("button", { class: "send-btn", "aria-label": "Send", onclick: () => send(input.value) }, icon("send", 16));
  const composer = h("div", { class: "composer" },
    h("button", { class: "icon-btn", "aria-label": "Dataset", title: "Dataset", onclick: () => openDataset() }, icon("database", 17)),
    input,
    sendBtn
  );
  const hint = h("div", { class: "composer-hint" },
    h("span", {}, "Enter to send · Shift+Enter for a new line"),
    h("span", {}, "Local models · every number from the rule engine")
  );
  const composerWrap = h("div", { class: "composer-wrap" }, composer, hint);
  const main = h("main", { class: "main" }, topbar, thread, composerWrap);
  const shell = h("div", { class: "shell", id: "shell" }, sidebar, main);

  document.getElementById("app").replaceChildren(shell);
  dom.shell = shell;
  dom.sessions = sessionsBox;
  dom.tools = tools;
  dom.userBox = userBox;
  dom.topTitle = topTitle;
  dom.modelSelect = modelSelect;
  dom.modelNote = modelBadge;
  dom.thread = thread;
  dom.input = input;
  dom.send = sendBtn;
}

function toggleNav(open) {
  if (dom.shell) dom.shell.classList.toggle("nav-open", !!open);
}

function chooseModel(value) {
  state.model = value;
  localStorage.setItem(LS_MODEL, value);
  renderTopbar();
  const row = state.models.find((item) => item.id === value);
  toast("Planner set to " + (row ? row.label : value) + ". The rule engine still owns every number.");
}

function renderAll() {
  if (!dom.shell) return;
  renderSidebar();
  renderTopbar();
  renderThread();
}

function renderTopbar() {
  if (!dom.topTitle) return;
  const first = state.messages.find((m) => m.role === "user");
  const title = first ? truncate(first.text, 64) : "New analysis";
  dom.topTitle.replaceChildren(
    h("b", {}, title),
    h("div", { class: "meta-row" },
      state.dataset
        ? h("button", { class: "dataset-pill", onclick: () => openDataset() },
            icon("database", 12),
            h("b", {}, state.dataset.name || "Dataset"),
            h("span", { class: "mono" }, state.dataset.currency || ""))
        : null
    )
  );

  const options = state.models.map((row) =>
    h("option", { value: row.id }, row.label + (row.provider === "ollama" ? " · local" : " · rules only"))
  );
  dom.modelSelect.replaceChildren.apply(dom.modelSelect, options);
  dom.modelSelect.value = state.model;
  const current = state.models.find((row) => row.id === state.model);
  const offline = state.models.length === 1 && state.models[0].id === "deterministic";
  dom.modelNote.replaceChildren(
    offline
      ? h("span", {}, "Ollama offline · ", h("button", {
          class: "btn sm ghost",
          onclick: async () => { await loadModels(); renderTopbar(); toast(state.models.length > 1 ? "Local models found." : "Ollama is still offline. The deterministic planner remains available."); },
        }, "Refresh"))
      : h("span", {}, current && current.free ? "free · local" : "registered rules")
  );
}

function renderSidebar() {
  if (!dom.sessions) return;
  if (!state.sessions.length) {
    dom.sessions.replaceChildren(emptyBlock("No conversations yet. Ask a question to open one."));
  } else {
    dom.sessions.replaceChildren.apply(dom.sessions, state.sessions.map((row) =>
      h("button", {
        class: "session" + (row.session_id === state.sessionId ? " active" : ""),
        onclick: () => selectSession(row.session_id),
      },
        h("b", {}, row.session_id === state.sessionId && state.messages.length ? truncate(firstUserText(), 34) : "Analysis · " + fmtTime(row.created_at)),
        h("span", {}, row.status === "closed" ? "closed" : fmtTime(row.updated_at || row.created_at))
      )
    ));
  }
  if (dom.userBox) {
    const initials = (state.user && state.user.name ? state.user.name : "CP")
      .split(/\s+/).map((part) => part[0]).join("").slice(0, 2).toUpperCase();
    dom.userBox.replaceChildren(
      h("div", { class: "user-avatar" }, initials),
      h("div", { class: "user-meta" },
        h("b", {}, state.user ? state.user.name : ""),
        h("span", {}, state.user ? state.user.role : "")
      ),
      h("button", { class: "icon-btn", title: "Sign out", "aria-label": "Sign out", onclick: logout }, icon("logout", 16))
    );
  }
}

function firstUserText() {
  const row = state.messages.find((m) => m.role === "user");
  return row ? row.text : "New analysis";
}

/* ------------------------------------------------------------------ */
/* thread                                                             */
/* ------------------------------------------------------------------ */

function renderThread(opts) {
  opts = opts || {};
  if (!dom.thread) return;
  dom.thread.replaceChildren();
  if (!state.messages.length) dom.thread.appendChild(renderHero());
  else state.messages.forEach((message) => dom.thread.appendChild(renderMessage(message)));
  if (opts.bottom !== false) requestAnimationFrame(() => { dom.thread.scrollTop = dom.thread.scrollHeight; });
}

const STARTERS = [
  { title: "Variance", text: "Variance for PRD-B at PLT-01 in 2026-09" },
  { title: "Special order", text: "Special order: 4000 units at 210 each for PRD-B at PLT-01 in 2026-09" },
  { title: "Customer margin", text: "Customer profitability for PLT-01 in 2026-09 for CUS-05" },
  { title: "Dataset capability", text: "What can you analyse on this dataset?" },
];

function renderHero() {
  const dataset = state.dataset;
  return h("section", { class: "hero" },
    h("h1", {}, "What should we cost out?"),
    h("p", {},
      "Ask in plain English. CostPilot resolves the period, plant and product, shows the parameter sheet, and only calculates after you confirm. " +
      "Every number comes from a registered rule with a formula, inputs and a source."
    ),
    dataset
      ? h("div", { class: "dataset-line" },
          pill("Dataset · " + truncate(dataset.name, 42), "teal"),
          pill(dataset.currency || "", "neutral"),
          dataset.row_counts ? pill(Object.values(dataset.row_counts).reduce((a, b) => a + Number(b || 0), 0) + " rows", "neutral") : null,
          h("button", { class: "btn sm ghost", onclick: () => openDataset() }, "Replace dataset")
        )
      : h("div", { class: "dataset-line" }, pill("No dataset loaded", "amber"), h("button", { class: "btn sm", onclick: () => openDataset() }, "Upload a workbook")),
    h("div", { class: "starters" },
      STARTERS.map((starter) =>
        h("button", { class: "starter", onclick: () => send(starter.text) },
          h("b", {}, starter.title),
          h("span", {}, starter.text)
        )
      )
    )
  );
}

function renderMessage(message) {
  if (message.role === "user") {
    return h("div", { class: "msg user" }, h("div", { class: "bubble" }, message.text));
  }
  const body = h("div", { class: "msg-body" });
  if (message.thinking) {
    body.appendChild(h("div", { class: "thinking" },
      h("span", { class: "dots" }, h("i"), h("i"), h("i")),
      h("span", {}, message.text || "Planning…")
    ));
  } else {
    if (message.text) body.appendChild(h("div", { class: "msg-text" }, message.text));
    if (message.plannerNote) body.appendChild(h("div", { class: "note" }, message.plannerNote));
    if (message.error) body.appendChild(errorPanel(message.error, message));
    if (message.auto) body.appendChild(renderAuto(message.auto, message));
    if (message.plan) body.appendChild(renderPlanBlock(message));
    if (message.card) body.appendChild(renderCard(message.card));
    const meta = h("div", { class: "msg-meta" }, fmtTime(message.at));
    if (message.runId) meta.appendChild(h("span", { class: "mono" }, message.runId));
    body.appendChild(meta);
  }
  return h("div", { class: "msg assistant" }, h("div", { class: "avatar" }, "CP"), body);
}

/* ------------------------------------------------------------------ */
/* plan rendering and confirmation                                     */
/* ------------------------------------------------------------------ */

const SOURCE_LABELS = {
  user_explicit: "You said",
  user_implied: "Inferred",
  registry: "Registry",
  lookup: "Lookup",
  policy_default: "Policy",
  engine_default: "Engine",
  demo_default: "Demo default",
  standard_cost: "Standard cost",
  snapshot: "Snapshot",
};

function sourcePill(source) {
  const label = SOURCE_LABELS[source] || sentenceCase(source || "resolved");
  const tone = source === "user_explicit" ? "teal" : source === "user_implied" ? "amber" : "outline";
  return pill(label, tone);
}

function plannerLabel(plan) {
  if (plan && plan.planner && String(plan.planner).startsWith("llm:")) {
    return "Planned by " + String(plan.planner).slice(4);
  }
  return "Deterministic planner";
}

function renderPlanBlock(message) {
  const plan = message.plan || {};
  const status = message.status || plan.status || "ready";
  if (status === "completed" || status === "cancelled") {
    const runId = plan.run_id || message.runId;
    return h("div", { class: "panel", style: { marginTop: "12px" } },
      h("div", { class: "panel-head" },
        h("div", {},
          h("div", { class: "eyebrow" }, "Plan"),
          h("h3", {}, plan.intent ? sentenceCase(plan.intent) : "Analysis"),
          h("div", { class: "small" }, status === "completed" ? "This plan has run. The result card is below." : "This plan was cancelled.")
        ),
        pill(status, status === "completed" ? "green" : "neutral")
      ),
      runId
        ? h("button", { class: "btn sm", onclick: () => openRun(runId) }, "Open run")
        : h("div", { class: "small" }, "Ask the question again to create a fresh plan.")
    );
  }

  const sheet = message.sheet || [];
  const requiresConfirm = !!plan.requires_confirmation;
  const isClarify = status === "needs_clarification";
  const confidence = Number(plan.confidence || 0);

  const head = h("div", { class: "card-head" },
    h("div", { class: "h" },
      h("div", { class: "eyebrow" }, "Plan · nothing calculated yet"),
      h("h3", {}, sentenceCase(plan.intent || "analysis")),
      h("div", { class: "meta-row" },
        pill(plannerLabel(plan), "teal"),
        h("span", { class: "pill " + (confidence < 0.6 ? "amber" : "outline") }, Math.round(confidence * 100) + "% confidence"),
        requiresConfirm ? pill("Needs confirmation", "amber") : pill("Ready to run", "green")
      )
    ),
    h("div", { class: "card-badges" }, pill("Rule engine", "neutral"))
  );

  const sheetNode = h("div", { class: "sheet" });
  sheet.forEach((row) => sheetNode.appendChild(sheetRow(row)));

  const clarify = plan.clarification || {};
  const options = clarify.options || [];
  const body = h("div", { class: "card-body" },
    isClarify && clarify.question ? h("div", { class: "verdict neutral" }, clarify.question) : null,
    sheet.length ? sheetNode : h("div", { class: "empty" }, "No parameters were resolved. Add a period, plant and product to the question."),
    isClarify
      ? h("div", { class: "clarify-note" },
          h("b", {}, "Choose an interpretation"),
          h("div", { class: "option-grid" },
            options.map((option) =>
              h("button", { class: "btn sm", onclick: () => send(String(option)) }, String(option))
            )
          )
        )
      : null
  );

  const foot = h("div", { class: "card-foot" });
  if (isClarify) {
    foot.append(h("span", { class: "small" }, "Answer with one of the options, or restate the question with an explicit period, plant and product."));
  } else {
    const confirmLabel = requiresConfirm ? "Confirm and run" : "Run analysis";
    if (!can("run")) {
      foot.append(
        h("span", { class: "small" }, "Your role can review and export but not run analyses."),
        h("div", { class: "grow" }),
        h("button", { class: "btn", onclick: logout }, "Switch user"),
        h("button", { class: "btn ghost", onclick: () => cancelPlan(message) }, "Cancel plan")
      );
    } else if (requiresConfirm && !can("confirm")) {
      foot.append(
        h("span", { class: "small" }, "A controller or administrator must confirm this plan before it runs."),
        h("div", { class: "grow" }),
        h("button", { class: "btn", onclick: () => copyPlanId(plan) }, icon("copy", 13), "Copy plan ID"),
        h("button", { class: "btn ghost", onclick: logout }, "Switch user"),
        h("button", { class: "btn ghost", onclick: () => cancelPlan(message) }, "Cancel plan")
      );
    } else {
      foot.append(
        h("span", { class: "small" }, "Edit any value, then confirm. Nothing is calculated until you confirm."),
        h("div", { class: "grow" }),
        h("button", { class: "btn ghost", onclick: () => cancelPlan(message) }, "Cancel plan"),
        h("button", { class: "btn primary", onclick: (event) => confirmPlan(message, event.currentTarget) }, confirmLabel)
      );
    }
  }

  return h("article", { class: "card plan-card" }, head, body, foot);
}

function sheetRow(row) {
  const key = row.key;
  const value = row.value;
  let control;
  let original;

  if (!row.editable) {
    original = value === null || value === undefined ? "" : String(value);
    control = h("div", { class: "plain" }, original || "—");
  } else if (key === "capacity_state") {
    original = value === null || value === undefined ? "idle" : String(value);
    control = h("select", { dataset: { key, original } },
      h("option", { value: "idle" }, "Idle capacity"),
      h("option", { value: "constrained" }, "Constrained capacity")
    );
    control.value = original === "constrained" ? "constrained" : "idle";
  } else if (typeof value === "boolean") {
    original = value ? "true" : "false";
    control = h("select", { dataset: { key, original } },
      h("option", { value: "true" }, "Yes"),
      h("option", { value: "false" }, "No")
    );
    control.value = original;
  } else {
    original = value === null || value === undefined ? "" : String(value);
    control = h("input", {
      type: "text",
      value: original,
      placeholder: "Not set",
      dataset: { key, original },
      "aria-label": row.label || key,
    });
  }

  const rowNode = h("div", { class: "sheet-row" },
    h("div", { class: "lbl" }, row.label || sentenceCase(key)),
    control,
    h("div", { class: "src" }, sourcePill(row.source), row.confirm ? pill("confirm", "amber") : null)
  );
  if (row.warning) rowNode.appendChild(h("div", { class: "sheet-warning" }, row.warning));
  return rowNode;
}

function editValue(key, raw) {
  if (String(key).startsWith("overlay.")) {
    const cleaned = String(raw).trim().replace(/%$/, "");
    const number = Number(cleaned);
    if (!Number.isNaN(number)) return String(number / 100);
  }
  return raw;
}

function collectEdits(node) {
  const controls = Array.from(node.querySelectorAll("[data-key]"));
  const edits = [];
  for (const control of controls) {
    const original = control.dataset.original === undefined ? "" : control.dataset.original;
    const current = control.value === undefined ? "" : String(control.value);
    if (current === original) continue;
    edits.push({ key: control.dataset.key, value: editValue(control.dataset.key, current), reason: "Edited in the parameter sheet" });
  }
  return edits;
}

async function confirmPlan(message, button) {
  if (state.sending) return;
  const card = button.closest(".plan-card");
  const edits = card ? collectEdits(card) : [];
  button.disabled = true;
  button.replaceChildren(h("span", { class: "spinner" }), " Running…");
  try {
    const payload = await api("/v1/plans/" + message.planId + "/confirm", {
      method: "POST",
      headers: { "Idempotency-Key": "ui:" + message.planId },
      body: { edits },
    });
    message.status = "completed";
    if (message.plan) message.plan.status = "completed";
    state.lastRun = payload.run_id;
    const assistant = {
      role: "assistant",
      text: payload.assistant_text || "",
      card: payload.card,
      runId: payload.run_id,
      planId: message.planId,
      at: new Date().toISOString(),
    };
    state.messages.push(assistant);
    renderThread();
    loadSessions().then(() => renderSidebar());
    toast("Run sealed · " + payload.run_id);
  } catch (err) {
    button.disabled = false;
    button.replaceChildren(message.status === "needs_confirmation" || (message.plan && message.plan.requires_confirmation) ? "Confirm and run" : "Run analysis");
    appendAssistantError(err);
  }
}

async function cancelPlan(message) {
  try {
    await api("/v1/plans/" + message.planId + "/cancel", { method: "POST", body: { reason: "Cancelled in the chat" } });
    message.status = "cancelled";
    if (message.plan) message.plan.status = "cancelled";
    renderThread({ bottom: false });
    toast("Plan cancelled. Nothing was calculated.");
  } catch (err) {
    appendAssistantError(err);
  }
}

function copyPlanId(plan) {
  const id = plan.plan_id || "";
  if (!id) { toast("This plan has no ID yet.", "error"); return; }
  navigator.clipboard.writeText(id)
    .then(() => toast("Plan ID copied: " + id + ". A controller can open the plan sheet and confirm it."))
    .catch(() => toast("Plan ID: " + id, null, 9000));
}

function appendAssistantError(err) {
  state.messages.push({ role: "assistant", error: err, at: new Date().toISOString() });
  renderThread();
}

/* ------------------------------------------------------------------ */
/* result card                                                        */
/* ------------------------------------------------------------------ */

function renderCard(card) {
  if (!card || !card.verdict) {
    return h("div", { class: "panel" }, h("div", { class: "small" }, "The run completed, but this card format is not available. Open the run for the raw result."));
  }
  const decision = card.verdict.decision || "neutral";
  const header = card.header || {};
  const head = h("div", { class: "card-head" },
    h("div", { class: "h" },
      h("div", { class: "eyebrow" }, "Result · sealed run"),
      h("h3", {}, card.intent_label || sentenceCase(card.intent)),
      h("div", { class: "meta-row" },
        header.dataset ? pill(truncate(header.dataset, 34), "teal") : null,
        header.period_id ? pill(header.period_id, "neutral") : null,
        header.plant_id ? pill("Plant " + header.plant_id, "neutral") : null,
        header.product_id && header.product_id !== "ALL" ? pill("Product " + header.product_id, "neutral") : null,
        header.customer_id ? pill("Customer " + header.customer_id, "neutral") : null,
        header.currency ? pill(header.currency, "outline") : null
      )
    ),
    h("div", { class: "card-badges" },
      card.validation && card.validation.ok === false ? pill("Validation failed", "red") : pill("Validated", "green"),
      pill("Rule engine", "outline")
    )
  );

  const body = h("div", { class: "card-body" });
  body.appendChild(h("div", { class: "verdict " + decision },
    h("div", { class: "v-head" },
      pill(decision === "favorable" ? "Favourable" : decision === "adverse" ? "Adverse" : "Result", decision === "favorable" ? "green" : decision === "adverse" ? "red" : "blue")
    ),
    h("div", {}, card.verdict.sentence || "")
  ));

  if (card.facts && card.facts.length) {
    const facts = h("div", { class: "facts" });
    card.facts.forEach((fact) => {
      facts.appendChild(h("div", { class: "fact" },
        h("div", { class: "k" }, fact.label || fact.fact_id),
        h("div", { class: "v" }, fact.display || fact.value || "—")
      ));
    });
    body.appendChild(facts);
  }

  (card.tables || []).forEach((table, index) => {
    const details = h("details", { class: "block", open: index === 0 });
    details.appendChild(h("summary", {},
      table.title || sentenceCase(table.id),
      h("span", { class: "count" }, (table.rows || []).length + " rows")
    ));
    const wrap = h("div", { class: "block-body" });
    if (table.rows && table.rows.length) {
      const tableNode = h("table", { class: "data" });
      const thead = h("thead");
      const headRow = h("tr");
      (table.columns || []).forEach((column) => headRow.appendChild(h("th", {}, column.label || column.key)));
      thead.appendChild(headRow);
      const tbody = h("tbody");
      table.rows.forEach((row) => {
        const tr = h("tr");
        (table.columns || []).forEach((column) => {
          const cell = row[column.key];
          let text;
          if (cell === null || cell === undefined) text = "—";
          else if (typeof cell === "object") text = JSON.stringify(cell);
          else if (typeof cell === "boolean") text = cell ? "Yes" : "No";
          else text = String(cell);
          tr.appendChild(h("td", {}, text));
        });
        tbody.appendChild(tr);
      });
      tableNode.append(thead, tbody);
      wrap.appendChild(tableNode);
    } else wrap.appendChild(emptyBlock("No rows."));
    details.appendChild(wrap);
    body.appendChild(details);
  });

  if (card.conditions && card.conditions.length) {
    body.appendChild(h("div", { class: "section-title" }, "Conditions"));
    body.appendChild(h("ul", { class: "small" }, card.conditions.map((line) => h("li", {}, String(line)))));
  }

  if (card.sensitivity && card.sensitivity.length) {
    const details = h("details", { class: "block" });
    details.appendChild(h("summary", {}, "Sensitivity", h("span", { class: "count" }, card.sensitivity.length + " points")));
    const list = h("div", { class: "block-body" });
    card.sensitivity.forEach((point) => {
      list.appendChild(h("div", { class: "gate" },
        h("div", { class: "g-main" },
          h("b", {}, point.label || ""),
          h("span", {}, point.display || point.value || ""),
          point.note ? h("div", { class: "g-fix" }, point.note) : null
        )
      ));
    });
    details.appendChild(list);
    body.appendChild(details);
  }

  if (card.warnings && card.warnings.length) {
    const details = h("details", { class: "block", open: true });
    details.appendChild(h("summary", {}, "Warnings", h("span", { class: "count" }, card.warnings.length)));
    const list = h("div", { class: "block-body" });
    card.warnings.forEach((warning) => {
      list.appendChild(h("div", { class: "gate" },
        h("div", { class: "g-main" },
          h("b", {}, warning.message || warning.code || "Warning"),
          warning.code ? h("span", {}, warning.code) : null,
          warning.remediation ? h("div", { class: "g-fix" }, warning.remediation) : null
        ),
        pill(warning.severity || "warning", "amber")
      ));
    });
    details.appendChild(list);
    body.appendChild(details);
  }

  if (card.assumptions && card.assumptions.length) {
    const details = h("details", { class: "block" });
    details.appendChild(h("summary", {}, "Assumptions", h("span", { class: "count" }, card.assumptions.length)));
    const list = h("div", { class: "block-body" });
    card.assumptions.forEach((item) => {
      list.appendChild(h("div", { class: "gate" },
        h("div", { class: "g-main" },
          h("b", {}, item.text || item.key || "Assumption"),
          h("span", {}, (SOURCE_LABELS[item.source] || sentenceCase(item.source || "")) + (item.evidence ? " · " + item.evidence : ""))
        ),
        item.confirmed ? pill("confirmed", "green") : pill("unconfirmed", "amber")
      ));
    });
    details.appendChild(list);
    body.appendChild(details);
  }

  if (card.rationale && card.rationale.text) {
    const details = h("details", { class: "block" });
    details.appendChild(h("summary", {}, "How the numbers were produced"));
    details.appendChild(h("div", { class: "block-body" },
      h("p", { class: "small", style: { margin: "0 0 6px" } }, card.rationale.text),
      h("div", { class: "small" },
        card.rationale.fallback_used
          ? "The validated deterministic template was used."
          : "The narration passed numeric and source validation."
      )
    ));
    body.appendChild(details);
  }

  if (card.remediation && card.remediation.length) {
    body.appendChild(h("div", { class: "warn-box" }, card.remediation.join(" ")));
  }

  const foot = h("div", { class: "card-foot" });
  const runId = card.run_id;
  foot.append(
    h("button", { class: "btn", onclick: () => openTrace(runId) }, "Trace"),
    h("button", { class: "btn", onclick: () => reperform(runId) }, "Re-perform"),
    h("button", { class: "btn", onclick: () => downloadExport(runId, "xlsx") }, icon("excel", 13), "Excel"),
    h("button", { class: "btn sm", onclick: () => downloadExport(runId, "pdf") }, "PDF"),
    h("button", { class: "btn sm", onclick: () => downloadExport(runId, "json") }, "JSON"),
    h("div", { class: "grow" }),
    h("span", { class: "mono", style: { color: "var(--muted)" } }, runId || "")
  );
  if (card.suggested_questions && card.suggested_questions.length) {
    body.appendChild(h("div", { class: "suggest" },
      card.suggested_questions.slice(0, 3).map((question) =>
        h("button", { class: "btn sm", onclick: () => send(question) }, question)
      )
    ));
  }
  return h("article", { class: "card" }, head, body, foot);
}

function renderAuto(auto, message) {
  if (!auto) return null;
  if (auto.type === "capability") {
    const capability = auto.capability || {};
    const readiness = capability.analysis_ready && !Array.isArray(capability.analysis_ready)
      ? Object.entries(capability.analysis_ready)
      : [];
    return h("div", { class: "panel", style: { marginTop: "12px" } },
      h("div", { class: "panel-head" }, h("h3", {}, "Dataset capability"), pill(capability.currency || "", "outline")),
      h("dl", { class: "kv" },
        h("dt", {}, "Dataset"), h("dd", {}, capability.dataset || ""),
        h("dt", {}, "Snapshot"), h("dd", {}, capability.snapshot_id || ""),
        h("dt", {}, "Periods"), h("dd", {}, (capability.periods || []).join(", ")),
        h("dt", {}, "Currency"), h("dd", {}, capability.currency || "")
      ),
      readiness.length ? h("div", { class: "chips" },
        readiness.map(([key, ok]) => pill(sentenceCase(key), ok ? "green" : "outline"))
      ) : null,
      h("div", { class: "row-actions" },
        h("button", { class: "btn sm", onclick: () => openDataset() }, "Open dataset"),
        h("button", { class: "btn sm ghost", onclick: () => send("Variance for PRD-B at PLT-01 in 2026-09") }, "Run a variance")
      )
    );
  }
  if (auto.type === "audit") {
    const verification = auto.verification || {};
    return h("div", { class: verification.ok ? "ok-box" : "error-box" },
      h("b", {}, verification.ok ? "Audit chain verified" : "Audit chain broken"),
      h("div", {}, verification.ok
        ? verification.checked + " events checked. Every hash follows the previous one."
        : "Break at " + (verification.first_break || "unknown") + ": " + (verification.reason || "hash mismatch") + "."),
      h("div", { class: "row-actions" }, h("button", { class: "btn sm", onclick: () => openTrust() }, "Open trust & audit"))
    );
  }
  if (auto.type === "trace") {
    return h("div", { class: "panel", style: { marginTop: "12px" } },
      h("div", { class: "panel-head" }, h("h3", {}, "Trace · " + (auto.trace && auto.trace.run_id ? auto.trace.run_id : "")), pill("read-only", "outline")),
      renderTrace(auto.trace)
    );
  }
  if (auto.type === "error") {
    return errorPanel({
      code: auto.error && auto.error.code,
      message: auto.error && auto.error.message,
      remediation: auto.remediation || [],
      actions: [{ action: "retry", label: "Retry" }],
    }, message);
  }
  return null;
}

/* ------------------------------------------------------------------ */
/* errors                                                             */
/* ------------------------------------------------------------------ */

function errorPanel(err, message) {
  const actions = (err && err.actions) || [{ action: "retry", label: "Retry" }];
  const remediation = (err && err.remediation) || [];
  return h("div", { class: "error-box" },
    h("div", { class: "e-head" },
      h("b", {}, "Could not complete this request"),
      pill((err && err.code) || "ERROR", "red")
    ),
    h("p", {}, (err && err.message) || "Unknown error."),
    remediation.length ? h("ul", {}, remediation.map((line) => h("li", {}, line))) : null,
    h("div", { class: "e-actions" },
      actions.slice(0, 3).map((action) =>
        h("button", {
          class: "btn sm",
          title: remediation[0] || "",
          onclick: () => runAction(action.action || action, message, err),
        }, (action && action.label) || sentenceCase(action && action.action))
      ),
      h("button", { class: "btn sm ghost", onclick: () => dismissMessage(message) }, "Dismiss")
    )
  );
}

function dismissMessage(message) {
  const index = state.messages.indexOf(message);
  if (index >= 0) state.messages.splice(index, 1);
  renderThread({ bottom: false });
}

function setComposer(text) {
  if (!dom.input) return;
  dom.input.value = text;
  autoGrow(dom.input);
  dom.input.focus();
  dom.input.setSelectionRange(text.length, text.length);
}

function scrollToLastPlan() {
  const nodes = dom.thread ? dom.thread.querySelectorAll(".plan-card") : [];
  if (nodes.length) {
    const last = nodes[nodes.length - 1];
    last.scrollIntoView({ behavior: "smooth", block: "center" });
    const input = last.querySelector("input,select");
    if (input) setTimeout(() => input.focus(), 260);
  } else {
    toast("There is no plan sheet in this conversation yet. Ask a question first.");
  }
}

function runAction(action, message, err) {
  const remediation = (err && err.remediation) || [];
  switch (action) {
    case "login":
    case "retry_login":
      logout();
      break;
    case "upload_template":
    case "download_template":
    case "fix_columns":
    case "reupload":
      openDataset();
      break;
    case "open_parameter_sheet":
    case "review_inputs":
    case "answer_clarification":
      scrollToLastPlan();
      break;
    case "show_supported":
      toast("Supported analyses: variance, special order, ABC, TDABC, customer profitability, master budget, scenario, forecast quality, divisional performance, alerts, group reporting, dataset capability, audit verification.", null, 8000);
      break;
    case "retry":
      if (state.lastQuestion) send(state.lastQuestion);
      else { toast("Edit the question and send it again."); setComposer(""); }
      break;
    case "alternate_format":
      if (state.lastRun) downloadExport(state.lastRun, "json");
      else toast("Open a result card and choose JSON.");
      break;
    case "choose_format":
      toast("Open a result card and pick Excel, PDF, or JSON.");
      break;
    case "request_access":
    case "change_scope":
      toast("Ask an administrator to add the permission to your role, or switch to an analyst or controller account.");
      break;
    case "refresh_registry":
      openSources();
      break;
    case "open_alert_builder":
      setComposer("Alert digest for 2026-09");
      break;
    case "run_alternative_view":
      toast("Open the parameter sheet and change the basis or inputs, then confirm again.");
      break;
    case "choose_customer":
      setComposer("Customer profitability for PLT-01 in 2026-09 for ");
      break;
    case "retry_after":
    case "queue":
      toast(remediation[0] || "Wait a moment, then try again.");
      break;
    default:
      if (remediation.length) toast(remediation[0]);
      else toast("Adjust the request and try again.");
  }
}

/* sending                                                            */
/* ------------------------------------------------------------------ */

function autoGrow(input) {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 190) + "px";
}

function modelLabel() {
  const row = state.models.find((item) => item.id === state.model);
  if (!row) return state.model || "the planner";
  return row.id === "deterministic" ? "the deterministic planner" : row.label;
}

async function ensureSession() {
  if (state.sessionId) return state.sessionId;
  const created = await api("/v1/sessions", { method: "POST", body: {} });
  state.sessionId = created.session.session_id;
  await loadSessions();
  renderSidebar();
  return state.sessionId;
}

async function send(text) {
  const value = String(text || "").trim();
  if (!value) return;
  if (state.sending) { toast("A question is already running. Wait for it to finish."); return; }
  state.sending = true;
  if (dom.input) { dom.input.value = ""; autoGrow(dom.input); }
  if (dom.send) dom.send.disabled = true;
  toggleNav(false);
  state.lastQuestion = value;
  state.messages.push({ role: "user", text: value, at: new Date().toISOString() });
  const thinking = {
    role: "assistant",
    thinking: true,
    text: state.model === "deterministic" ? "Resolving the plan with the deterministic planner…" : "Planning with " + modelLabel() + "…",
  };
  state.messages.push(thinking);
  renderThread();
  try {
    const session = await ensureSession();
    const payload = await api("/v1/sessions/" + session + "/messages", {
      method: "POST",
      body: { text: value, model: state.model || null },
    });
    const index = state.messages.indexOf(thinking);
    if (index >= 0) state.messages.splice(index, 1);
    const assistant = {
      role: "assistant",
      text: payload.message ? payload.message.text : "",
      plan: payload.plan,
      sheet: payload.parameter_sheet || [],
      status: payload.status,
      planId: payload.plan_id,
      at: payload.message ? payload.message.created_at : new Date().toISOString(),
      plannerNote: payload.planner_note || null,
      auto: payload.result || null,
    };
    state.messages.push(assistant);
    await loadSessions();
  } catch (err) {
    const index = state.messages.indexOf(thinking);
    if (index >= 0) state.messages.splice(index, 1);
    state.messages.push({ role: "assistant", error: err, at: new Date().toISOString() });
  } finally {
    state.sending = false;
    if (dom.send) dom.send.disabled = false;
    renderThread();
    renderSidebar();
    renderTopbar();
    if (dom.input) dom.input.focus();
  }
}

async function newChat() {
  if (state.sending) { toast("Wait for the current question to finish."); return; }
  try {
    const created = await api("/v1/sessions", { method: "POST", body: {} });
    state.sessionId = created.session.session_id;
    state.messages = [];
    await loadSessions();
    toggleNav(false);
    renderAll();
    if (dom.input) dom.input.focus();
  } catch (err) {
    toastError(err);
  }
}

async function selectSession(sessionId) {
  if (sessionId === state.sessionId) { toggleNav(false); return; }
  if (state.sending) { toast("Wait for the current question to finish."); return; }
  state.sessionId = sessionId;
  state.messages = [];
  toggleNav(false);
  renderAll();
  dom.thread.replaceChildren(loadingBlock("Opening the conversation…"));
  await loadThread();
  renderAll();
}
