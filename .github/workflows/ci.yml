name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Gates
        run: python -m costpilot.cli check
      - name: Canonical demo
        run: python -m costpilot.cli demo
      - name: Phase 2 planner run
        run: python -m costpilot.cli run "Customer profitability for PLT-01 in 2026-09 for CUS-05"
      - name: Audit chain
        run: python -m costpilot.cli verify
      - name: Connector catalog
        run: python -m costpilot.cli connectors
